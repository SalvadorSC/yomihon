name: Chinese fork release

# Tags like zh-v0.4.3-1 publish a telemetry-free arm64 APK to a GitHub Release.
# Signing uses the keystore committed in signing/zh-fork-release.jks. The
# passwords are the public debug-style values documented in README.md
# (store/key password "android", alias "zh-fork"). Repo secrets were not
# available for SIGNING_KEY, so the key is stored in git and every build
# that writes keystore.properties from those values produces an update
# that installs over the previous zh-v* release.

on:
  push:
    tags:
      - zh-v*

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build and publish arm64 APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up JDK
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5.5.0
        with:
          java-version-file: .github/.java-version
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Download ML models
        run: |
          FILES=(
            "bluolightning/manga-ocr-tflite:mocr_2025_decoder_float32.tflite:app/src/main/assets/ocr/decoder.tflite:b6f0b49e7537abc24de4d5e7f44c71c3e04b4f30a9dac6b5704db94c963ce31b"
            "bluolightning/manga-ocr-tflite:mocr_2025_encoder_fp32.tflite:app/src/main/assets/ocr/encoder.tflite:126441c11edb3f3c9da639647ba82d846872a7ad51d62cdbc50767fa5abf4f43"
            "bluolightning/manga-ocr-tflite:mocr_2025_embeddings_float32.bin:app/src/main/assets/ocr/embeddings.bin:ef1959fd6b2ed011b782722d975a67332b859ccc717688ad06a16d170145bc6c"
            "bluolightning/manga-ocr-mobile:v1_fp16/decoder.tflite:app/src/main/assets/ocr_fast/decoder.tflite:116db3f02364ceac91f86f46e54979d4fd7209e8d8820f3812410b0d732ee2b8"
            "bluolightning/manga-ocr-mobile:v1_fp16/encoder.tflite:app/src/main/assets/ocr_fast/encoder.tflite:d724e5682c874b98202d4ac8f3e84848cd9d06a5e27cb0dadb27ebaea1b35f47"
            "leoxs22/manga-panel-detector-yolo26n:manga_panel_detector_int8.tflite:data/src/main/assets/panel_detector/model.tflite:b1a7d8d4492e04a777ae0d3efd9dc1fbd6e8f361971eadb813279ce3dfd1b464"
          )

          for item in "${FILES[@]}"; do
            IFS=":" read -r REPO_PATH REMOTE_PATH LOCAL_PATH HASH <<< "$item"
            mkdir -p "$(dirname "$LOCAL_PATH")"
            echo "Downloading $REMOTE_PATH from $REPO_PATH..."
            curl -fsSL "https://huggingface.co/$REPO_PATH/resolve/main/$REMOTE_PATH" -o "$LOCAL_PATH"
            echo "$HASH  $LOCAL_PATH" | sha256sum -c - || { echo "Hash mismatch for $LOCAL_PATH"; exit 1; }
          done

      - name: Read tag version
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/}"
          if [[ ! "$tag" =~ ^zh-v([0-9]+\.[0-9]+\.[0-9]+)-([0-9]+)$ ]]; then
            echo "Tag must look like zh-v0.4.3-1 (got $tag)" >&2
            exit 1
          fi
          base="${BASH_REMATCH[1]}"
          number="${BASH_REMATCH[2]}"
          echo "name=${base}-zh.${number}" >> "$GITHUB_OUTPUT"
          echo "code=$((2800 + number))" >> "$GITHUB_OUTPUT"

      - name: Write signing config
        run: |
          cat > keystore.properties << 'EOF'
          storeFile=../signing/zh-fork-release.jks
          storePassword=android
          keyAlias=zh-fork
          keyPassword=android
          EOF

      - name: Build arm64 release
        run: ./gradlew assembleRelease -PabiSplits=arm64-v8a -PforkVersionCode=${{ steps.version.outputs.code }} -PforkVersionName=${{ steps.version.outputs.name }}

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-arm64-v8a-release.apk yomihon-arm64-v8a.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          tag_name: ${{ github.ref_name }}
          name: Yomihon Chinese ${{ steps.version.outputs.name }}
          body: |
            Phone download (arm64): [yomihon-arm64-v8a.apk](https://github.com/SalvadorSC/yomihon/releases/download/${{ github.ref_name }}/yomihon-arm64-v8a.apk)

            Version code ${{ steps.version.outputs.code }}. Signed with `signing/zh-fork-release.jks` (alias `zh-fork`), so a later `zh-v*` release installs over this one. It does not install over upstream Yomihon or a build signed with a different debug key; uninstall that copy first.

            No Firebase telemetry. Chinese (offline) is bundled. Japanese Legacy/Fast models are included.
          files: yomihon-arm64-v8a.apk
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
